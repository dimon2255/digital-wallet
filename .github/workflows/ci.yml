name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore BitcoinPayments.sln

      - name: Build
        run: dotnet build BitcoinPayments.sln --no-restore --configuration Release

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: >
          dotnet test tests/BitcoinPayments.UnitTests
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Report unit test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Test Results
          path: tests/BitcoinPayments.UnitTests/TestResults/unit-results.trx
          reporter: dotnet-trx

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run integration tests
        run: >
          dotnet test tests/BitcoinPayments.IntegrationTests
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"

      - name: Report integration test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Integration Test Results
          path: tests/BitcoinPayments.IntegrationTests/TestResults/integration-results.trx
          reporter: dotnet-trx

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run E2E tests
        run: >
          dotnet test tests/BitcoinPayments.EndToEndTests
          --configuration Release
          --logger "trx;LogFileName=e2e-results.trx"

      - name: Report E2E test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: E2E Test Results
          path: tests/BitcoinPayments.EndToEndTests/TestResults/e2e-results.trx
          reporter: dotnet-trx
